name: Audit archive PDFs

on:
  push:
    branches: ["main"]
    paths:
      - "migration/issues.json"
      - "scripts/audit_pdfs.py"
      - ".github/workflows/audit-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pdf-audit"
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Audit PDFs
        run: python3 scripts/audit_pdfs.py

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/pdf-audit.csv migration/pdf-audit.md
          if git diff --cached --quiet; then
            echo "No audit changes to commit"
          else
            git commit -m "Update PDF archive audit"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: chgpu-pdf-audit
          path: |
            migration/pdf-audit.csv
            migration/pdf-audit.md
