<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Выпуски — Редакция ЧГПУ</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="topline"><div class="wrap"><span>Служебный раздел</span><span>Управление выпусками</span></div></div>
<section class="section"><div class="wrap"><div class="dashboard">
<aside class="side"><div class="logo">ИЗВЕСТИЯ ЧГПУ</div><a href="editor.html">Рукописи</a><a class="active" href="issues-admin.html">Выпуски</a><a href="index.html">← На сайт</a></aside>
<main class="dash-main"><div class="dash-head"><div><div class="crumb">Редакция</div><h2>Выпуски журнала</h2></div></div>
<div class="issue-admin-grid"><section class="form-card"><h3>Создать выпуск</h3><form id="issueForm">
<div class="field-row"><div class="form-group"><label>Год</label><input name="year" type="number" value="2026" required></div><div class="form-group"><label>Номер</label><input name="number" placeholder="№3 (55)" required></div></div>
<div class="form-group"><label>Серия</label><input name="series" value="Серия 1. Гуманитарные и общественные науки" required></div>
<div class="form-group"><label>Заголовок выпуска</label><input name="title"></div>
<div class="form-group"><label>Дата публикации</label><input name="publication_date" type="date"></div>
<button class="btn accent">Создать выпуск</button></form><div id="issueMsg" class="note" style="margin-top:12px"></div></section>
<section><div id="issuesList"></div></section></div>
</main></div></div></section>
<script src="api.js"></script><script>
const demoIssues=[{id:1,year:2026,series:'Серия 1. Гуманитарные и общественные науки',number:'№2 (54)',publication_date:'2026-07-01',is_published:1,article_count:5},{id:2,year:2026,series:'Серия 1. Гуманитарные и общественные науки',number:'№3 (55)',publication_date:null,is_published:0,article_count:0}];
async function loadIssues(){
 const box=document.getElementById('issuesList');
 let items;
 if(window.CHGPU_API.enabled){try{items=(await editorIssues()).items}catch(e){location.href='login.html';return}} else items=demoIssues;
 box.innerHTML=items.map(i=>'<article class="issue-admin-card"><div><div class="eyebrow">'+chgpuEscape(i.year)+'</div><h3>'+chgpuEscape(i.number)+'</h3><p>'+chgpuEscape(i.series)+'</p><span class="note">'+Number(i.article_count||0)+' статей</span></div><div><span class="status-pill">'+(Number(i.is_published)?'Опубликован':'Черновик')+'</span><div style="margin-top:12px"><button class="btn ghost" data-publish-issue="'+Number(i.id)+'" data-value="'+(Number(i.is_published)?0:1)+'">'+(Number(i.is_published)?'Снять с публикации':'Опубликовать выпуск')+'</button></div></div></article>').join('');
 box.querySelectorAll('[data-publish-issue]').forEach(btn=>btn.addEventListener('click',async()=>{try{await editorSetIssuePublished(Number(btn.dataset.publishIssue),Number(btn.dataset.value)===1);await loadIssues()}catch(err){document.getElementById('issueMsg').textContent=err.message}}));
}
document.getElementById('issueForm').addEventListener('submit',async e=>{
 e.preventDefault();const m=document.getElementById('issueMsg');
 if(!window.CHGPU_API.enabled){m.textContent='В демо-режиме выпуск не сохраняется на сервер.';return;}
 const fd=new FormData(e.currentTarget);
 try{await editorCreateIssue(Object.fromEntries(fd.entries()));m.textContent='Выпуск создан.';e.currentTarget.reset();await loadIssues()}catch(err){m.textContent=err.message}
});
loadIssues();
</script><script src="session-tools.js"></script></body></html>
