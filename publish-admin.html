<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Публикация статьи — Редакция ЧГПУ</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="topline"><div class="wrap"><span>Служебный раздел</span><span>Публикация статьи</span></div></div>
<section class="section"><div class="wrap narrow"><div class="crumb">Редакция / Публикация</div><h1 style="font-size:40px">Опубликовать принятую статью</h1>
<form id="publishForm" class="form-card">
<div class="form-group"><label>Принятая рукопись</label><select name="submission_id" id="submissionSelect" required></select></div>
<div class="form-group"><label>Выпуск</label><select name="issue_id" id="issueSelect" required></select></div>
<div class="field-row"><div class="form-group"><label>Страницы</label><input name="pages" placeholder="45–58"></div><div class="form-group"><label>УДК</label><input name="udc"></div></div>
<div class="form-group"><label>DOI</label><input name="doi"></div>
<div class="form-group"><label>HTML-текст статьи (необязательно)</label><textarea name="html_body" style="min-height:220px"></textarea></div>
<button class="btn accent">Опубликовать статью</button>
<div id="publishMsg" class="notice neutral" style="display:none;margin-top:16px"></div>
</form></div></section>
<script src="api.js"></script><script>
async function init(){
 const s=document.getElementById('submissionSelect'),i=document.getElementById('issueSelect');
 if(!window.CHGPU_API.enabled){s.innerHTML='<option>Демо: рукопись CHGPU-2026-0047</option>';i.innerHTML='<option>Демо: №3 (55)</option>';return;}
 try{
   const [subs,issues]=await Promise.all([editorList('accepted'),editorIssues()]);
   s.innerHTML=subs.items.map(x=>'<option value="'+x.id+'">'+x.public_id+' — '+x.title+'</option>').join('');
   i.innerHTML=issues.items.map(x=>'<option value="'+x.id+'">'+x.year+' — '+x.number+' — '+x.series+'</option>').join('');
 }catch(e){location.href='login.html';}
}
document.getElementById('publishForm').addEventListener('submit',async e=>{
 e.preventDefault();const box=document.getElementById('publishMsg');box.style.display='block';
 if(!window.CHGPU_API.enabled){box.innerHTML='Демо-режим: на Beget здесь будет создана реальная публичная статья.';return;}
 try{
   const fd=new FormData(e.currentTarget);
   const d=await editorPublishArticle(Object.fromEntries(fd.entries()));
   box.innerHTML='<strong>Статья опубликована.</strong><br><a href="'+d.public_url+'">Открыть публикацию →</a>';
 }catch(err){box.textContent=err.message}
});
init();
</script></body></html>
